name: CLA Assistant

# Asks every external contributor to accept CLA.md once, before a pull request
# can be merged. Signatures are stored in signatures/cla.json on the main branch.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Matthis/ECpdfSign/blob/main/CLA.md
          branch: main
          allowlist: Matthis,dependabot[bot],renovate[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/Matthis/ECpdfSign/blob/main/CLA.md)
            and sign it by replying to this pull request with the sentence below.
            You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!

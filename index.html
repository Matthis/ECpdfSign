<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECpdfSign</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="toolbar" id="toolbar" role="toolbar" aria-label="Werkzeugleiste"></header>

    <div class="message" id="message" role="alert" hidden>
      <span class="message-text" id="message-text"></span>
      <button type="button" class="message-close" id="message-close" aria-label="Meldung schließen">×</button>
    </div>

    <main class="workspace">
      <nav class="thumbnails" id="thumbnails" aria-label="Seitenübersicht"></nav>
      <section class="page-view" id="page-view" aria-label="Ausgewählte Seite">
        <p class="empty-hint" id="empty-hint">
          Noch kein Dokument geöffnet.<br />
          Klicken Sie auf „PDF Öffnen“, um eine PDF-Datei auszuwählen.
        </p>
        <div class="page-stage" id="page-stage" hidden></div>
      </section>
    </main>
  </body>
</html>
